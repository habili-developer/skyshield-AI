version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - LLM_PROVIDER=mock
      - API_KEY=${API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/skyshield.db}
      - SKYSHIELD_MODE=${SKYSHIELD_MODE:-demo}
      - REGION_CONFIG_PATH=${REGION_CONFIG_PATH:-configs/regions/dodoma.json}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://backend:8000
