version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skyshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skyshield}
      POSTGRES_DB: skyshield
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyshield"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      SKYSHIELD_MODE: operational
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      API_KEY: ${API_KEY:-}
      DATABASE_URL: postgresql+psycopg://skyshield:${POSTGRES_PASSWORD:-skyshield}@postgres:5432/skyshield
      REGION_CONFIG_PATH: ${REGION_CONFIG_PATH:-configs/regions/dodoma.json}
      ENABLE_CORS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
